<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Online Store</title>
  <link rel="stylesheet" href="login.css" />
</head>

<body>

  <div class="login-container">
    <h2>Login</h2>
    <p class="subtitle">Login as Customer or Admin</p>

    <form id="loginForm">

      <!-- ROLE SELECT -->
      <select id="role" required>
        <option value="customer">Customer</option>
        <option value="admin">Admin</option>
      </select>

      <input type="email" id="email" placeholder="Email (Customer)" />
      <input type="text" id="username" placeholder="Username (Admin)" style="display:none;" />

      <input type="password" id="password" placeholder="Password" required />

      <button type="submit">Login</button>

      <p id="loginMsg"></p>
    </form>

    <p class="register-link">
      New Customer? <a href="register.html">Create Account</a>
    </p>

    <div class="demo-info">
      <p><b>Admin Demo:</b></p>
      <p>Username: <b>admin</b></p>
      <p>Password: <b>1234</b></p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
